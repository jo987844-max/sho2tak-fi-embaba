<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة | شقتك في إمبابة</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>body{margin:0;background:#f4f8f6;font-family:Cairo,Arial;color:#173229}.top{background:#0b2d4a;color:#fff;padding:16px}.wrap{max-width:1050px;margin:auto;padding:16px}.panel{background:#fff;border:1px solid #e0e8e4;border-radius:17px;padding:20px;margin-top:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}label{display:block;font-size:11px;font-weight:800;margin:6px 0}input,select,textarea{width:100%;padding:11px;border:1px solid #d8e3de;border-radius:9px;box-sizing:border-box;font:inherit}textarea{min-height:80px}button{border:0;border-radius:10px;padding:11px 16px;font-weight:800;cursor:pointer}.green{background:#087b5b;color:#fff}.gray{background:#edf3f0}.danger{background:#fff0f0;color:#a33}.muted{font-size:10px;color:#788780}.row{display:flex;gap:8px}.item{padding:13px;border:1px solid #e2ebe6;border-radius:12px;margin-top:9px;display:flex;justify-content:space-between;gap:10px}.login{max-width:420px;margin:70px auto}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.item{display:block}.row{flex-wrap:wrap}}</style></head><body><div class="top"><div class="wrap"><b>شقتك في إمبابة — لوحة الإدارة</b></div></div><main class="wrap"><section id="login" class="panel login"><h2>دخول المدير</h2><p class="muted">استخدم البريد وكلمة المرور اللذين تنشئهما في Firebase Authentication.</p><label>البريد الإلكتروني</label><input id="email" type="email" placeholder="admin@example.com"><label>كلمة المرور</label><input id="password" type="password"><button id="loginBtn" class="green" style="width:100%;margin-top:12px">دخول</button><p id="loginMsg" class="muted"></p></section><section id="app" class="hide"><div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2>إضافة / تعديل عقار</h2><button id="logout" class="gray">خروج</button></div><form id="form" class="grid"><input type="hidden" id="id"><div><label>النوع</label><select id="type"><option value="rent">إيجار</option><option value="sale">بيع</option></select></div><div><label>المنطقة</label><select id="area"><option>أرض الجمعية</option><option>مدينة التحرير</option><option>شارع الوحدة</option><option>البوهي</option><option>طلعت حرب</option></select></div><div class="full"><label>عنوان الإعلان</label><input id="title" required></div><div><label>السعر</label><input id="price" type="number" required></div><div><label>المساحة م²</label><input id="size" type="number"></div><div><label>الغرف</label><input id="rooms" type="number"></div><div><label>الدور</label><input id="floor"></div><div class="full"><label>صورة الإعلان</label><input id="imageFile" type="file" accept="image/*"><div id="preview" class="muted" style="margin-top:6px"></div></div><div class="full"><label>الوصف</label><textarea id="desc"></textarea></div><div class="full row"><button class="green">حفظ العقار</button><button type="button" id="reset" class="gray">إلغاء</button></div></form><p id="msg" class="muted"></p></div><div class="panel"><h2>الإعلانات</h2><div id="list"></div></div></section></main><script>
const KEY='sho2tak_properties_v1'; const PASS='1234'; const $=id=>document.getElementById(id);
function data(){return JSON.parse(localStorage.getItem(KEY)||'[]')} function save(a){localStorage.setItem(KEY,JSON.stringify(a))}
function show(){ $('login').classList.add('hide'); $('app').classList.remove('hide'); load() }
$('loginBtn').onclick=()=>{if($('password').value===PASS) show(); else $('loginMsg').textContent='كلمة المرور غير صحيحة. كلمة المرور الافتراضية: 1234'};
$('logout').onclick=()=>{location.reload()};
function load(){const a=data(); $('list').innerHTML=a.map(p=>`<div class=item><div><b>${p.title||'عقار'}</b><div class=muted>${p.area||''} · ${p.type==='rent'?'إيجار':'بيع'} · ${p.price||0} جنيه</div></div><div><button class=gray onclick='editProp("${p.id}")'>تعديل</button> <button class=danger onclick='delProp("${p.id}")'>حذف</button></div></div>`).join('')||'<p class=muted>لا توجد إعلانات.</p>'}
window.editProp=id=>{const p=data().find(x=>x.id===id);if(!p)return;$('id').value=p.id;$('type').value=p.type;$('area').value=p.area;$('title').value=p.title;$('price').value=p.price;$('size').value=p.size;$('rooms').value=p.rooms;$('floor').value=p.floor;$('desc').value=p.desc;$('preview').textContent=p.imageUrl?'تم حفظ صورة لهذا الإعلان.':'';scrollTo({top:0,behavior:'smooth'})};
window.delProp=id=>{if(confirm('حذف الإعلان؟')){save(data().filter(x=>x.id!==id));load()}};
$('form').onsubmit=async e=>{e.preventDefault();const a=data(),id=$('id').value||crypto.randomUUID();let imageUrl='';const f=$('imageFile').files[0];if(f)imageUrl=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});else imageUrl=a.find(x=>x.id===id)?.imageUrl||'';const old=a.findIndex(x=>x.id===id);const obj={id,type:$('type').value,area:$('area').value,title:$('title').value,price:Number($('price').value),size:Number($('size').value)||0,rooms:Number($('rooms').value)||0,floor:$('floor').value,imageUrl,desc:$('desc').value,createdAt:old>=0?a[old].createdAt:Date.now()};if(old>=0)a[old]=obj;else a.unshift(obj);save(a);$('msg').textContent='تم الحفظ بنجاح.';$('form').reset();$('id').value='';$('preview').textContent='';load()};
$('reset').onclick=()=>{$('form').reset();$('id').value='';$('preview').textContent=''};
</script></body></html>
